services:
  - type: web
    name: trustshare-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustshare-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://trustshare-web.onrender.com
      - key: FILES_ENCRYPTION_KEY
        generateValue: true
      - key: FILES_STORAGE_DIR
        value: ./storage/files
      - key: SCHEDULER_ENABLED
        value: "true"
    disk:
      name: trustshare-files
      mountPath: /opt/render/project/src/server/storage
      sizeGB: 1

  - type: web
    name: trustshare-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trustshare-api.onrender.com

databases:
  - name: trustshare-db
    plan: free